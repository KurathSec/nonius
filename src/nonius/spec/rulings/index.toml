# The composition specification.
#
# SPEC semver is independent of the package version:
#   patch = editorial;
#   minor = new rulings, no existing decision changes;
#   major = any change that alters a decision for any existing corpus case.
#
# A major bump is the only way past the composition-drift gate
# (tests/test_spec_drift.py), and tools/update_snapshot.py refuses to regenerate the
# snapshot without one.

[spec]
version = "2.0.0"

[[changelog]]
version = "2.0.0"
summary = """
EMIT-ALL-0002 is superseded by EMIT-ALL-0006. No composite, gold, link verdict or
quarantine outcome moves; what changes is that the ruling now states the case its check
has force in.

EMIT-ALL-0002's statement was correct and its rationale was not. It called the
chained-component evaluation and the realized composite's own evaluation "two independent
routes to the same number". They are independent only when the realizer reaches the gold
independently. The default prompt realizer computes the gold by chaining, so for it the
check compares one computation against itself -- which nonius already reported in an info
diagnostic, and which ARCHITECTURE.md already documented. The spec was the last place
still asserting the unqualified claim, and a normative record contradicting the tool's own
diagnostic is the kind of thing this project treats as a defect rather than a nuance.

Why this is a MAJOR when LINK-ALL-0002 -> LINK-ALL-0007 was a MINOR, given that both are
supersessions that move no value: the calibration snapshot records composite diagnostics as
``code:ruling`` (tests/tools_snapshot.py), so the cited id is itself a snapshot value.
EMIT-ALL-0002's id appears there and LINK-ALL-0002's did not. The drift gate therefore
sees two changed values and requires the MAJOR. The bump is forced by what the snapshot
records, not by a decision changing, and it is taken rather than worked around -- weakening
the gate to fit a supersession would trade a real check for a version number.
"""

[[changelog]]
version = "1.1.0"
summary = """
DEPTH-ALL-0003, authored in 1.0.0 and unreleased, was amended in place here: its first
draft said a depth-1 composite "is identical to the singleton it came from", which
overstates the case -- the measurement is identical, the rendered presentation is the
realizer's. Amending a ruling no released version has carried is allowed
(ARCHITECTURE.md section 4); what immutability protects is a meaning someone could already
have published a number under. The amendment is recorded here, in the cycle that made it.

LINK-ALL-0002 is superseded by LINK-ALL-0007. A MINOR: no decision changes, no value moves,
and every link verdict is what it was. What changes is the stated reason for the rule, and
it needed changing because it was wrong.

The old statement justified liveness by claiming that with a dead link "a system can skip
the upstream component entirely and still be scored correct". It cannot: the composite's
gold carries every component's results qualified by position (EMIT-ALL-0005), so skipping
the upstream fails the composite on the upstream's own key. The corollary matters too --
a dead-link composite does not beat its product bound, so the quarantine gate never catches
one, and any claim that it does was wrong.

The rule stands on the corrected reason. A dead link costs dependence, not difficulty: the
composite is still failed if either component fails, but it is a conjunction of items rather
than a chain, and depth stops meaning how far an answer was carried.
"""

[[changelog]]
version = "1.0.0"
summary = """
A correction release, made before any number was published under 0.1.0. Three decisions
moved, so it is a MAJOR.

EMIT-ALL-0003 is superseded by EMIT-ALL-0005. Composite identity no longer hashes the spec
version: hashing it meant an editorial patch -- a change that by definition alters no
decision -- moved every composite id, which is exactly the "only if" direction the ruling
itself claims. The version is still recorded beside every emitted composite; it is a stamp
on how the composite was decided, not part of what it is. Every id changed once, here, and
will not move again for a spec change.

DEPTH-ALL-0001 is superseded by DEPTH-ALL-0003. The old title and statement said links
number depth minus one, as a general rule. It is not one: it holds for a simple path and
for a single-sink fan-in, but fan-out lets one component feed several slots, so a depth-2
chain can carry two links.

AUDIT-ALL-0001 is superseded by AUDIT-ALL-0005. The old wording called the reported k
"the largest constructible component count". It is the largest over the two shapes the
audit enumerates, and a mixed DAG can exceed it -- demonstrably so on the shipped
calibration corpus, where a four-component chain exists that the audit does not reach.
The search space is now declared rather than the claim widened.

Also corrected, none of which changes a decision and so none of which needed a
supersession: AUDIT-ALL-0002's rationale said one item family could start a chain on the
reference asset when two can; LINK-ALL-0006's reuse ceiling, previously stated but never
implemented, is now enforced by `nonius.bound.guard_reuse`; and the audit now reports
*which depths hit* the path-enumeration cap, not merely what the cap was, which is what
AUDIT-ALL-0004 asked for.

"""

[[changelog]]
version = "0.1.0"
summary = """
First specification. Fixes the depth convention (components, not links), states that link
type compatibility is necessary but not sufficient and that liveness over the upstream
codomain is the admissibility criterion, and requires literal suppression so a composite
cannot be solved by reading the upstream answer out of the downstream's presentation.
The liveness ruling is the one with evidence behind it: measured on a committed
four-model archive, 32.2% of ordered item pairs are type-compatible but only 7.0% carry
a live link, so a composer that checks types alone manufactures mostly degenerate items.
"""
