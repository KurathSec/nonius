# Pre-registration for the first paid run against composed items.
#
# Written BEFORE any completion is bought. That ordering is the whole point: the
# quarantine rule can only ever confirm itself unless its ceiling is fixed in advance
# (BOUND-ALL-0004), and a threshold chosen after seeing the data is not a threshold.
#
# STATUS: EXECUTED. 14268 completions were bought against this design, and the outcome is
# in validation/run_01/ -- the graded archive, the harness that re-derives every threshold
# from it, and the result. Nothing in the thresholds below was touched after the run; that
# is what the file is for, and the git history is the evidence.
#
# `nonius run` still only prints a plan and has no code path that can spend. Spending means
# calling nonius.run.execute() from your own code, with your own model client,
# authorised=True, and a pre-registration whose status you have deliberately set to
# "authorised". This file has never said "authorised" and does not now: the run used a
# local copy differing by that one line, whose sha256 is recorded in
# validation/run_01/inputs.json.

[run]
id = "run-01"
# "executed", not "authorised": nonius.run.execute() refuses anything that is not exactly
# "authorised", so this records what happened without arming the file.
status = "executed"
# The spec this design is fixed under, and the one the run must execute under. Moved from
# 1.1.0 when the gold-agreement ruling was superseded by EMIT-ALL-0006. Nothing in this
# file changed with it: the supersession corrects a ruling's stated reason and moves no
# composite, gold, link verdict or bound, so every count, threshold and budget below is the
# number it was. Recorded here rather than silently carried, because a pre-registration
# that names a spec it will not run under is a pre-registration of a different run.
spec = "2.0.0"
subject = "Spaghetti Architect comprehend items, public dev split"
subject_commit = "826f4cbf8f4d4c7e2d8473374694360c43fbb820"

[population]
# Fixed from the reference audit in validation/spaghetti_audit/derived/audit.json.
# Depths 8 and 13 are excluded deliberately: the audit predicts every system at 0.0000
# with a floored fraction of 1.0000, so they would buy a row of zeros. Recording the
# exclusion here rather than discovering it later is the difference between a design and
# an excuse.
# Depth 1 is the positive control rather than a composed arm: it buys the run's own components as
# singletons so a dead harness is distinguishable from a null result. See KT-0.
depths = [1, 2, 3, 5]
composites_per_depth = 500
profile = "max"
# ONE rendering cell is purchased. The realizer emits all five languages; buying every one
# would multiply the budget by five, and the completion count below assumes it does not.
language = "python"
languages_emitted = ["python", "javascript", "go", "java", "cpp"]
selection = """
For the composed depths (2, 3, 5): the first composites_per_depth chains of
nonius.audit.constructible(analysis, depth) in its enumeration order -- paths first, then
the fan-ins the dedup keeps -- with the cap applied after enumeration. Note that the path
enumeration yields one chain per node sequence rather than every distinct composite over
those items: alternative (result, slot) assignments along the same sequence are not
enumerated (AUDIT-ALL-0004, caps.paths_are_one_chain_per_node_sequence). At depth 2 the
drawn 500 are all paths and span 500 distinct sequences.

Depth 1 is drawn differently, and deliberately: the control arm is the union of the
components that appear in the composed sets actually drawn above -- 55 items -- realized as
singletons. It is NOT constructible(analysis, 1), which is the live-link graph's node set
(59 items, four of which appear in no drawn chain), and NOT nonius.audit.singletons(items),
which is all 100. Either would buy a different population from the one KT-0 reads.
"""
excluded_depths = [8, 13]
excluded_reason = "audit predicts 0.0000 for all four systems and floored = 1.0000"

# composites_per_depth is a CAP rather than a quota, and at depth 3 it does not bind: the audit
# enumerates only 134 constructible chains there (120 paths + 14 fan-ins), against 729 at
# depth 2 and 732 at depth 5. Recording the shortfall here rather than discovering it when
# the run comes up short is the difference between a design and a surprise.
constructible_available = { depth_2 = 729, depth_3 = 134, depth_5 = 732 }
planned_composites = { depth_1 = 55, depth_2 = 500, depth_3 = 134, depth_5 = 500 }
# The 55 are every distinct component the composed arms use: agg_stats 16, allowlist 19,
# threshold_select 14, fsm_transition 6.
control_components = 55

[systems]
# The same four-model ladder the singleton archive was computed on. Using different
# systems would break the bridge table, which is the one thing the run is for.
models = [
  "meta-llama/Meta-Llama-3.1-8B-Instruct",
  "mistralai/Mistral-Small-3.2-24B-Instruct-2506",
  "meta-llama/Llama-3.3-70B-Instruct-Turbo",
  "deepseek-ai/DeepSeek-V4-Flash",
]
k = 3
temperature = 0.0
note = "k = 3 rather than the archive's 8, because the band comes from the archive's replicates rather than from this run's"

[budget]
estimated_completions = 14268   # (55 + 500 + 134 + 500) items x 4 models x k=3.
                                # Not 3 x 500 x 4 x 3 = 18000: depth 3 has only 134
                                # constructible chains, so the 500 cap cannot bind there.
                                # The 55 are KT-0's positive control, 660 completions.
cost_class = "under_25_usd"
credential = "external; liveness not guaranteed. If it is dead, nothing here runs and the free arms stand."

# --------------------------------------------------------------------------------------
# Thresholds. Each states what it would take to be WRONG, and each is fixed now.
# --------------------------------------------------------------------------------------

[[threshold]]
id = "KT-0-execution-validity"
statement = """
A run that returned nothing usable must not be readable as a result. This arm exists
because none of the other four can tell those apart, and that is provable rather than
suspected: the product of accuracies in [0,1] is never greater than their maximum, so a
measured accuracy of 0.0 is always at least as close to the product as to the max. KT-1
therefore CANNOT fire on a dead harness. KT-2 quarantines only composites that beat their
bound, and 0.0 beats nothing, so it cannot fire either. KT-2b compares orderings, and
all-zero measurements are ties. Every threshold except KT-4 would pass, and KT-4 is already
registered as firing on the free predicted numbers regardless of what is measured.

So the run buys the 55 components its composites are built from, as depth-1 singletons,
through the same realizer, the same language and the same k. These are items the committed
archive already scores, so their accuracy is known in advance and any large shortfall is
the harness rather than the systems.

Firing this makes the run VOID rather than null: it is re-run, and no other threshold is read.
"""
# `floor`, deliberately not `ceiling`: load_preregistration() selects the quarantine
# ceiling by the ruling a threshold cites (BOUND-ALL-0004) and refuses two of them, so a
# `ceiling` key here -- KT-0 cites no ruling -- would be ignored rather than read. Naming
# it `floor` keeps the intent readable and does not lean on that.
floor_accuracy = 0.60
floor_parse_rate = 0.90
fires_if = "mean depth-1 accuracy for deepseek-ai/DeepSeek-V4-Flash over the 55 control components is below 0.60, or fewer than 90% of all completions parse"
note = """
0.60 is set well below the archive's own DeepSeek mean of 0.8385 so that ordinary
k=3-versus-k=8 variation and the control set's skew toward the harder families cannot trip
it; what it catches is a harness returning nothing usable, which is what it is for.
"""

[[threshold]]
id = "KT-1-product-vs-max"
ruling = "BOUND-ALL-0001"
statement = """
Composite accuracy should track the product of the component accuracies rather than their
maximum. If measured accuracy for the system named below sits closer to the maximum than to
the product at depth 3, composition did not preserve the construct and the restored headroom
is headroom on a different measurand.

Scoped to depth 3, not "3 or beyond". Depth 5 is refused a product bound by the reuse
ceiling declared in [reuse], so there is nothing there to compare against; registering a
depth-5 arm would be registering a comparison this design cannot make.
"""
# The system is named rather than selected. "The top system" would be ambiguous after the fact --
# top on the singleton instrument, or on the composites? -- and a threshold whose scope is
# decided after seeing the data is not a threshold.
system = "deepseek-ai/DeepSeek-V4-Flash"
fires_if = "for deepseek-ai/DeepSeek-V4-Flash, measured is closer to max_prediction than to product_prediction at depth 3"
predicted_product = { depth_2 = 0.3346, depth_3 = 0.0804, depth_5 = 0.0000 }
note = "predicted values are from the reference audit, for the system named above"

[[threshold]]
id = "KT-2-quarantine-ceiling"
ruling = "BOUND-ALL-0004"
statement = """
A composite whose measured accuracy exceeds its product prediction by more than the
archive's replicate noise band is quarantined as shortcut-contaminated. If more than 20%
of composites are quarantined at any depth, the composer is manufacturing shortcut-solvable
items faster than it manufactures difficulty, and the operator fails.
"""
ceiling = 0.20
fires_if = "quarantine rate > 0.20 at any depth"

[[threshold]]
id = "KT-2b-ordering-inversion"
statement = """
Any pairwise system ordering inversion against the singleton ordering, beyond the
replicate band, means comparability was destroyed rather than preserved -- which is the
opposite of what this instrument is for.

**But on this asset the independence null already inverts, and that is registered here
rather than discovered later.** The predicted (product-bound) ordering on the constructible
population matches the singleton ordering at depth 2 and departs from it at depth 3, where
the strongest singleton system falls to third. Nothing about composition causes that: the
depth-3 population is dominated by one item family on which the systems rank differently,
so the inversion is a property of which composites the link graph can build.

So the singleton-anchored test cannot discriminate at depth 3 on its own, and two readings
are registered instead of one:
  (a) against the singleton ordering -- expected to fire at depth 3, and reported as
      evidence about the POPULATION rather than about composition;
  (b) against the predicted ordering at the same depth -- this is the discriminating one.
      A measured ordering that departs from what the independence bound predicts, beyond
      the band, is evidence about composition.
Only (b) is treated as a kill test. Recording (a)'s expected failure in advance is the
point: a threshold that the null already trips is not a threshold, and finding that out
after the run would have been indistinguishable from a result.
"""
singleton_order = [
  "meta-llama/Meta-Llama-3.1-8B-Instruct",
  "mistralai/Mistral-Small-3.2-24B-Instruct-2506",
  "meta-llama/Llama-3.3-70B-Instruct-Turbo",
  "deepseek-ai/DeepSeek-V4-Flash",
]
fires_if = "the MEASURED ordering departs from the PREDICTED ordering at the same depth, for any adjacent pair, by more than the noise band"
predicted_order_matches_singleton = { depth_2 = true, depth_3 = false }
note = """
The yardstick is the replicate noise band (0.0137 on this archive, emitted as
archive.noise_band in the reference audit), and it is narrower than
the instrument's own resolution floor: m* at depth 3 is 0.1192, and every adjacent predicted
gap at that depth is below it. So a departure large enough to clear the band can still be
smaller than the smallest difference the composed instrument resolves, and reading it as a
result would be reading noise. KT-2b(b) therefore fires only on a departure exceeding BOTH
the replicate band and m* at that depth, and any departure between the two is reported as
unresolvable rather than as evidence either way.

depth 5 is excluded here too: with no product bound there is no predicted ordering to
compare against.
"""
yardstick = "max(replicate noise band, m* at that depth)"

[[threshold]]
id = "KT-4-floor-not-ceiling"
statement = """
Composition must buy resolution rather than merely trade a ceiling for a floor. The
discriminating fraction at the best depth must exceed the singleton's by at least 0.05
absolute.
"""
singleton_discriminating_item_level = 0.3273
singleton_discriminating_program_level = 0.7200
# One scalar cannot cover both baselines, because they are computed at different units and
# therefore at different replicate counts. Item level is one rendering cell
# (sp.archive(home, profile=..., language=...).k() == 8); program level pools the fifteen
# cells as replicates (audit.json archive.k == 120, discriminating 72/100 = 0.7200).
baseline_k_item_level = 8
baseline_k_program_level = 120
run_k = 3
baseline_caveat = """
The two baselines are computed at different replicate counts -- item level at k = 8 per
rendering cell, program level at k = 120 over the fifteen pooled cells -- and the run buys
k = 3, so neither comparison is like-for-like. The discriminating
fraction counts items on which any two systems differ, and fewer draws means coarser rates
and so a different count -- the comparison is therefore not like-for-like, and the direction
of the bias is not obvious enough to correct for. Registered as a known confound rather than
adjusted after the fact: if KT-4's margin turns on less than the difference k could
plausibly make, the honest report is that the run did not settle it.
"""
fires_if = "best-depth discriminating fraction - singleton discriminating fraction < 0.05, on the matching unit"
note = """
This one is already in trouble on the free prediction, and saying so now is the point of
pre-registering it. At the program level -- the unit the composed rows are computed on --
the singleton discriminates on 0.7200, and the best predicted composite depth is 3 at
0.7164, BELOW the baseline. Depth 2 predicts 0.5446, further below. So on the predicted
numbers this threshold fires at every depth. The measured run is what decides, but the
design is committed to reporting that outcome rather than reaching for a depth, or a unit,
that flatters it.
"""

[reuse]
# LINK-ALL-0006's ceiling, declared before measurement like every other threshold here. A
# top-level table rather than a [[threshold]], because the reuse ceiling is not read out of
# the threshold list at all: load_preregistration() takes as the quarantine ceiling only the
# threshold citing BOUND-ALL-0004, and reads this one from [reuse].
ceiling = 100
note = """
The maximum number of composites any single component may appear in, above which
`guard_reuse` refuses to report a product bound at that depth.

Measured on the planned population rather than derived from arithmetic:
  depth 2:  500 composites over 49 distinct components, worst  33 (7% of the set)
  depth 3:  134 composites over 22 distinct components, worst  60 (45%)
  depth 5:  500 composites over  6 distinct components, worst 428 (86%)

The component counts are of the composites this design DRAWS rather than of the pools they are
drawn from: depth 2's full pool of 729 chains spans 59 components, and the first 500 span
49. The union across all three depths is the 55 that KT-0 buys as singletons.

100 is a judgement, and this is what it decides. Depths 2 and 3 are priced; **depth 5 is
refused**, and that is the point of declaring the ceiling in advance rather than after
seeing which depths flatter the instrument. 720 of the 732 constructible depth-5 chains --
including all 500 this design draws -- live inside one family's six near-duplicate
programs, because the link graph has nowhere else to go that deep. Their components are
about as far from exchangeable as a population can be, so multiplying marginal rates would
produce a bound with no standing. The instrument declining to quote a number there is the
instrument working.
"""

[declared_limitations]
execution_validity = """
Until KT-0 was added, no registered arm could distinguish a null result from a broken run:
KT-1 and KT-2 pass on all-zero measurements by construction, and KT-4 fires regardless.
That gap was found by this project's own adversarial review rather than by the design.
"""
model_level_unit = """
Four systems and three adjacent pairs. Leave-one-out across systems is unavailable. No
claim about ordering stability generalises to a leaderboard, and this is declared rather
than discovered.
"""
stratification_circularity = """
Component difficulty strata come from the same four systems the run measures. Any claim
about which stratum recovers the most resolution is circular in the stratification, though
not in the gold, and would need a fifth system that contributed nothing to it.
"""
component_reuse = """
The run draws 500 of 729 chains at depth 2, all 134 at depth 3, and 500 of 732 at depth 5.
Reuse is forced by the link graph and it worsens sharply with depth: 49 distinct components
at depth 2, 22 at depth 3, and 6 at depth 5, where a single program appears in 86% of the
set. So the per-item rates behind the product bound are not exchangeable, and at depth 5
they are not close. Reuse multiplicity is reported per component and
`nonius.bound.guard_reuse` refuses to price a set whose worst component exceeds the ceiling
declared in [reuse] above (LINK-ALL-0006) -- which, at the declared ceiling of 100, means
depth 5 gets no product bound and its row will carry measured accuracy only.
"""
