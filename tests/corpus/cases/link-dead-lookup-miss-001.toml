[case]
id = "link-dead-lookup-miss-001"
rulings = ["LINK-ALL-0002", "LINK-ALL-0007"]
kind = "link"
computed_by = "hand"
notes = """
thr-live.verdict is str and lk-miss.key is str, so the pair is type-compatible and a
type-only composer would emit it. It is dead.

thr-live.verdict has the declared codomain ["high", "low"]. lk-miss holds the table
{alpha: x, beta: y} with default "unknown". Neither "high" nor "low" is a key of that
table, so both probes return the default:

  key="high" -> miss -> "unknown"
  key="low"  -> miss -> "unknown"

One distinct answer over two probed values: the downstream answer does not depend on the
upstream answer.

What that costs is dependence, not difficulty. The composite's gold still carries
c0_verdict as well as c1_route, so both components must be answered and the composite still
sits on its product bound -- a system cannot skip thr-live and be scored correct, and the
quarantine gate will never flag this item. It is simply not a chain: nothing is carried
from the first part to the second. That is the failure mode type compatibility cannot see,
and it is why liveness is enforced when the item is built (LINK-ALL-0007).
"""

[expect]
upstream = "thr-live"
result = "verdict"
downstream = "lk-miss"
slot = "key"
live = false
distinct_outcomes = 1
probed = 2
