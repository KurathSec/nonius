int probe set (LINK-ALL-0003):

  probe   0 1 2 5   ->  0,1,2,5 < 10   ->  "low"
  probe   10 50 100 1000 10000 60000  ->  >= 10  ->  "high"
  probe   -1  ->  < 10  ->  "low"

