[case]
id = "manifest-roundtrip-001"
rulings = ["CORE-ALL-0001", "CORE-ALL-0003"]
kind = "manifest"
computed_by = "hand"
notes = """
Counted by reading tests/corpus/items.jsonl. 10 records.

Slots, per item:
  sum-a 0, sum-b 0, thr-live 1, thr-dead 1, dual-a 2,
  lk-live 1, lk-miss 1, lk-nocodomain 1, mem-a 1, float-item 1
  0 + 0 + 1 + 1 + 2 + 1 + 1 + 1 + 1 + 1 = 9

Slot tags, enumerated:
  int    thr-live.subject, thr-dead.subject, dual-a.subject_a, dual-a.subject_b,
         mem-a.probe                                                          = 5
  str    lk-live.key, lk-miss.key, lk-nocodomain.key                          = 3
  float  float-item.subject                                                   = 1
  5 + 3 + 1 = 9, which agrees with the per-item count above.

Results, per item:
  sum-a 1, sum-b 1, thr-live 1, thr-dead 1, dual-a 2,
  lk-live 1, lk-miss 1, lk-nocodomain 1, mem-a 1, float-item 1
  1 + 1 + 1 + 1 + 2 + 1 + 1 + 1 + 1 + 1 = 11
  (An item with no slots still has results: sum-a and sum-b are pure producers.)

Result tags, enumerated:
  int   sum-a.total, sum-b.total                                              = 2
  str   thr-live.verdict, thr-dead.verdict, dual-a.verdict_a, dual-a.verdict_b,
        lk-live.route, lk-miss.route, lk-nocodomain.route, float-item.verdict = 8
  bool  mem-a.present                                                         = 1
  2 + 8 + 1 = 11, which agrees.

CORE-ALL-0001 is what makes mem-a's declaration meaningful: its result is bool, and a tag
function testing int before bool would report it as int, since bool subclasses int in
Python. link-type-mismatch-001 shows what that error would cost.
"""

[expect]
items = 10
slots = 9
results = 11
slot_tags = { int = 5, str = 3, float = 1 }
result_tags = { int = 2, str = 8, bool = 1 }
roundtrips = true
