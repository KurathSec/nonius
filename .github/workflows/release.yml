name: release
on:
  push:
    tags: ["v*"]
permissions:
  # No step writes to the repository: the jobs read, build, and publish.
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]" -c constraints/ci.txt
      - run: ruff check src tests tools && mypy && pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      - name: tag must be an ancestor of main
        run: git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: tag must equal the package version, and not be a dev version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/nonius/_version.py)
          [ "refs/tags/v$version" = "$GITHUB_REF" ] || { echo "tag != v$version"; exit 1; }
          case "$version" in *dev*) echo "refusing to release a dev version"; exit 1 ;; esac

      - name: changelog must have a section for this version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/nonius/_version.py)
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | grep -q '[^[:space:]]' || { echo "empty changelog section"; exit 1; }

      # setup-python provides pip, never `build`; install it pinned from the same file
      # that pins the isolated PEP 517 environment below.
      - run: pip install build==1.2.2 -c constraints/build.txt
      - run: python -m build
        env: { PIP_CONSTRAINT: constraints/build.txt }

      - name: sdist must not ship excluded paths
        run: |
          ! tar tzf dist/*.tar.gz | grep -E "(/paper/|/\.github/|/CLAUDE\.md$|/site/|/scratch/)"

      - name: smoke-test the wheel, not the source tree
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/nonius env
          /tmp/smoke/bin/nonius spec list | head -3

      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish-pypi:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { skip-existing: true }
