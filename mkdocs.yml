site_name: nonius
site_description: Compose the benchmark you already have -- and find out for free whether you can.
repo_url: https://github.com/KurathSec/nonius
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Honesty: honesty.md
  - Validation: validation.md
  - Rulings: spec/rulings.md
  - Contributing: contributing.md
# ARCHITECTURE.md is deliberately not hosted: it is written for someone with the tree in
# front of them.
